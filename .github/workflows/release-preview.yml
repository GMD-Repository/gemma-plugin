name: Publish Preview Release

on:
  push:
    branches:
      - main
      - beta
      - dev
    paths-ignore:
      - 'docs/**'
      - 'metadata.txt'
      - 'CHANGELOG.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release-preview:
    name: Build & Release Preview
    runs-on: ubuntu-latest

    steps:
      # ── 1. Generate Gemma Bot Token ──────────────────────────────────
      - name: Generate Gemma Bot Token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── 2. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.PREVIEW_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 3. Setup Python ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Install dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 5. Run preview pipeline ──────────────────────────────────────
      - name: Run preview pipeline
        id: preview
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PREVIEW_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release/release_pipeline.py \
            --mode preview \
            --branch "${{ github.ref_name }}"

      # ── 6. Commit beta channel files ─────────────────────────────────
      - name: Commit beta channel files directly
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PREVIEW_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Gemma Release Bot[bot]"
          git config user.email "gemma-release-bot[bot]@users.noreply.github.com"
          git add docs/user-guide/public/gemma-beta.xml docs/user-guide/public/latest-beta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update beta channel files for preview ${{ steps.preview.outputs.revision }} [skip ci]" && git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main)
