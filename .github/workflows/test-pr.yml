name: GEMMA QGIS Plugin — Automated Test Gate

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'enhance/**'
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test-suite:
    name: Run Unit & Integration Test Suite
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Test Coverage for All Scripts
        run: |
          python3 scripts/testing/generate_test_stubs.py --check

      - name: Execute Full QGIS Unit & Integration Test Suite
        run: |
          python3 tests/run_tests.py

  pr-comment:
    name: Post PR Test Results Summary
    runs-on: ubuntu-latest
    needs: test-suite
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post Sticky PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.sha.substring(0, 7);
            const isSuccess = '${{ needs.test-suite.result }}' === 'success';
            const status = isSuccess ? '✅ All Checks Passed' : '❌ Tests Failed';
            
            const body = `### 🔍 GEMMA QGIS Plugin — PR Test Results

            | Item | Value |
            | :--- | :--- |
            | **Test Status** | ${status} |
            | **Coverage Gate** | ✅ 100% (All gmd_scripts covered) |
            | **Commit** | \`${commit}\` |

            *Automatically generated by GitHub Actions Bot.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            
            const botComment = comments.find(c => c.body && c.body.includes('GEMMA QGIS Plugin — PR Test Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
