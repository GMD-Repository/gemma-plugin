name: Release Gemma Plugin (Stable)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer Bump (auto = detect from version, minor, patch, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom Version (optional manual override e.g. 3.1.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Build & Release Plugin
    runs-on: ubuntu-latest

    steps:
      # ── 1. Generate Gemma Bot Token ──────────────────────────────────
      - name: Generate Gemma Bot Token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── 2. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 3. Setup Python ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Install dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 5. Run release pipeline ──────────────────────────────────────
      - name: Run release pipeline
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/release/release_pipeline.py \
            --mode stable \
            --bump-type "${{ inputs.bump_type || 'auto' }}" \
            --custom-version "${{ inputs.custom_version || '' }}"

      # ── 5a. Fetch recipients from Google Sheet (Secured) ───────────
      - name: Fetch email recipients from Google Sheet
        id: gsheet-emails
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: |
          python scripts/release/gsheet_release.py \
            --fetch-emails \
            --worksheet-emails "email_gemma" \
            --output-file "scripts/release/.recipients.txt"

      # ── 6. Send email notification (batched blast) ───────────────────
      - name: Notify team — release ready
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO || secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          EMAIL_TO_FALLBACK: ${{ secrets.EMAIL_TO }}
          RECIPIENTS: ${{ steps.gsheet-emails.outputs.recipients }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ZIP_NAME: ${{ steps.release.outputs.zip_name }}
          RELEASE_BODY: ${{ steps.release.outputs.release_body_html || steps.release.outputs.release_body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_URL: "https://gemma-plugin.vercel.app/changelog.html"
        run: |
          python scripts/release/send_release_email.py \
            --batch-size 80 \
            --delay-seconds 2

      # ── 7. Log release record to Google Sheet (Secured) ──────────────
      - name: Log release record to Google Sheet
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: |
          python scripts/release/gsheet_release.py \
            --log-release \
            --version "${{ steps.release.outputs.version }}" \
            --zip-name "${{ steps.release.outputs.zip_name }}" \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}"

