name: Release Gemma Plugin (Stable)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer Bump (auto = detect from version, minor, patch, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom Version (optional manual override e.g. 3.1.0)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Build & Release Plugin
    runs-on: ubuntu-latest

    steps:
      # ── 1. Generate Gemma Bot Token ──────────────────────────────────
      - name: Generate Gemma Bot Token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── 2. Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token || secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 3. Setup Python ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Install dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 5. Run release pipeline ──────────────────────────────────────
      - name: Run release pipeline
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/release/release_pipeline.py \
            --mode stable \
            --bump-type "${{ inputs.bump_type || 'auto' }}" \
            --custom-version "${{ inputs.custom_version || '' }}"

      # ── 5a. Fetch recipients from Google Sheet (Secured) ───────────
      - name: Fetch email recipients from Google Sheet
        id: gsheet-emails
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: |
          python scripts/release/gsheet_release.py \
            --fetch-emails \
            --worksheet-emails "email_gemma" \
            --output-file "scripts/release/.recipients.txt"

      # ── 6. Send email notification (batched blast) ───────────────────
      - name: Notify team — release ready
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO || secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          EMAIL_TO_FALLBACK: ${{ secrets.EMAIL_TO }}
          RECIPIENTS: ${{ steps.gsheet-emails.outputs.recipients }}
          SUBJECT: "[GEMMA Plugin] v${{ steps.release.outputs.version }} — Stable Release Ready"
          HTML_BODY: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>GEMMA Plugin Notification</title>
              <style>
                body { 
                  font-family: Arial, Helvetica, sans-serif; 
                  line-height: 1.5; 
                  color: #333333; 
                  margin: 0; 
                  padding: 0; 
                  background-color: #f5f5f5;
                }

                .email-container { 
                  max-width: 600px; 
                  margin: 16px auto; 
                  background-color: #ffffff; 
                  border: 1px solid #e2e8f0;
                  border-radius: 6px;
                }

                .content { 
                  padding: 24px; 
                }

                .title {
                  font-size: 20px;
                  font-weight: bold;
                  color: #1e293b;
                  margin-bottom: 8px;
                }

                .text {
                  font-size: 14px;
                  color: #555555;
                  margin-bottom: 12px;
                }

                .box { 
                  background-color: #f8fafc; 
                  border: 1px solid #e2e8f0; 
                  border-radius: 6px;
                  padding: 16px; 
                  margin: 14px 0; 
                }

                .box-title { 
                  font-size: 15px; 
                  font-weight: bold; 
                  color: #0f172a;
                  margin-bottom: 6px; 
                }

                .list { 
                  font-size: 14px;
                  margin: 6px 0;
                }

                .button { 
                  display: inline-block; 
                  background-color: #2563a8; 
                  color: #ffffff !important; 
                  padding: 10px 18px; 
                  text-decoration: none; 
                  border-radius: 4px; 
                  font-size: 13px;
                  font-weight: bold;
                  margin: 6px 0;
                }
              </style>
            </head>

            <body style="font-family: Arial, Helvetica, sans-serif; line-height: 1.5; color: #333333; margin: 0; padding: 0; background-color: #f5f5f5;">
              <div class="email-container" style="max-width: 600px; margin: 16px auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; font-family: Arial, Helvetica, sans-serif;">
                <div class="content" style="padding: 24px;">
                  <div class="title" style="font-size: 20px; font-weight: bold; color: #1e293b; margin-bottom: 8px;">Release Announcement: GEMMA Plugin v${{ steps.release.outputs.version }}</div>
                  <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin-bottom: 12px;">
                    We are pleased to formally announce the production release of the <strong>GEMMA Plugin</strong> (Version
                    <strong>${{ steps.release.outputs.version }}</strong>).
                  </div>

                  <!-- Release Summary -->
                  <div class="box" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; margin: 14px 0;">
                    <div class="box-title" style="font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 6px;">Release Summary</div>
                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin: 4px 0;"><strong>Product:</strong> GEMMA QGIS Plugin</div>
                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin: 4px 0;"><strong>Version:</strong> ${{ steps.release.outputs.version }}</div>
                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin: 4px 0;"><strong>Platform:</strong> QGIS Plugin (.zip)</div>
                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin: 4px 0;"><strong>Status:</strong> Official Production / General Availability</div>
                  </div>

                  <!-- Changelog & Highlights -->
                  <div class="box" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; margin: 14px 0;">
                    <div class="box-title" style="font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 6px;">Changelog &amp; Highlights</div>
                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin: 4px 0;">
                      ${{ steps.release.outputs.release_body_html || steps.release.outputs.release_body }}
                    </div>
                  </div>

                  <!-- Installation & Deployment -->
                  <div class="box" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px; margin: 14px 0;">
                    <div class="box-title" style="font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 6px;">Installation &amp; Deployment</div>

                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin-bottom: 10px;">
                      <strong>QGIS Repository Installation:</strong> If your QGIS client is connected to the official GEMMA
                      repository, QGIS will automatically prompt you for update. Open QGIS and navigate to <em>Plugins →
                      Manage and Install Plugins → GEMMA → Upgrade / Install Plugin</em>.
                    </div>

                    <div class="text" style="font-size: 14px; color: #555555; line-height: 1.5; margin-bottom: 12px;">
                      <strong>Manual Download &amp; Documentation:</strong> You may also download the official release package
                      directly or review technical documentation:
                    </div>

                    <div style="margin-bottom: 10px;">
                      <a href="https://gemma-plugin.vercel.app/getting-started.html"
                         class="button"
                         style="display: inline-block; background-color: #2563a8; color: #ffffff !important; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; margin-right: 8px; margin-top: 4px; margin-bottom: 4px;"
                         target="_blank">
                        View Documentation
                      </a>

                      <a href="https://github.com/${{ github.repository }}/releases/download/v${{ steps.release.outputs.version }}/${{ steps.release.outputs.zip_name }}"
                         class="button"
                         style="display: inline-block; background-color: #475569; color: #ffffff !important; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; margin-top: 4px; margin-bottom: 4px;"
                         target="_blank">
                        Download Release Package
                      </a>
                    </div>

                    <div style="margin-top: 8px; font-size: 12px; color: #777777; line-height: 1.4;">
                      If the direct package link is unavailable, assets may still be propagating.
                      You can access the
                      <a href="https://github.com/${{ github.repository }}/releases"
                         style="color: #2563a8; text-decoration: none;"
                         target="_blank">
                        Official Releases Directory
                      </a>.
                    </div>
                  </div>
                </div>
              </div>
            </body>
            </html>
        run: |
          python scripts/release/send_release_email.py \
            --batch-size 80 \
            --delay-seconds 2

      # ── 7. Log release record to Google Sheet (Secured) ──────────────
      - name: Log release record to Google Sheet
        if: steps.release.outputs.released == 'true' && success()
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: |
          python scripts/release/gsheet_release.py \
            --log-release \
            --version "${{ steps.release.outputs.version }}" \
            --zip-name "${{ steps.release.outputs.zip_name }}" \
            --actor "${{ github.actor }}" \
            --repo "${{ github.repository }}"

