<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <!-- QField Brand Gradients -->
    <linearGradient id="qfieldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E9628" />
      <stop offset="100%" stop-color="#3D681B" />
    </linearGradient>
    <linearGradient id="qfieldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="qfieldBrandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B8026" />
      <stop offset="50%" stop-color="#5E9628" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76BD39" />
      <stop offset="100%" stop-color="#589632" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B8026" />
      <stop offset="100%" stop-color="#335919" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C681E" />
      <stop offset="100%" stop-color="#254212" />
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#00897B" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group (Package Box + QField Location Pin Crest) -->
  <g transform="translate(10, 4)">
    <!-- Shadow beneath package -->
    <ellipse cx="32" cy="56" rx="25" ry="5.5" fill="#000000" opacity="0.18" />

    <!-- 3D Package Box -->
    <!-- Top Face -->
    <polygon points="32,13 56,23 32,33 8,23" fill="url(#boxTop)" stroke="#264412" stroke-width="0.8" />
    <!-- Left Face -->
    <polygon points="8,23 32,33 32,54 8,44" fill="url(#boxLeft)" stroke="#264412" stroke-width="0.8" />
    <!-- Right Face -->
    <polygon points="32,33 56,23 56,44 32,54" fill="url(#boxRight)" stroke="#264412" stroke-width="0.8" />

    <!-- Package Tape / Ribbon -->
    <polygon points="26,15.5 38,20.5 38,48.5 26,43.5" fill="url(#tapeGrad)" opacity="0.95" />
    <polygon points="20,18 44,28 40,29.7 16,19.7" fill="#52E0AA" opacity="0.45" />

    <!-- GIS Location Pin Badge -->
    <g transform="translate(32, 21)">
      <!-- Pin Shadow -->
      <ellipse cx="0" cy="14" rx="7" ry="2.5" fill="#000000" opacity="0.25" />
      <!-- Pin Body -->
      <path d="M0, -16 C-8,-16 -12,-10 -12,-3 C-12,5 0,14 0,14 C0,14 12,5 12,-3 C12,-10 8,-16 0,-16 Z" fill="url(#qfieldTeal)" stroke="#FFFFFF" stroke-width="1.6" />
      <!-- Inner White Ring -->
      <circle cx="0" cy="-4" r="4" fill="#FFFFFF" />
      <!-- Inner Green Core -->
      <circle cx="0" cy="-4" r="2" fill="#5E9628" />
    </g>
  </g>

  <!-- Vertical Separator Line -->
  <line x1="78" y1="14" x2="78" y2="56" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Text Elements -->
  <!-- "PACKAGE FOR" -->
  <text x="92" y="30" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="2">PACKAGE FOR</text>

  <!-- "QField" -->
  <text x="91" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#qfieldBrandText)">QField</text>
</svg>