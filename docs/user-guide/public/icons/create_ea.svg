<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Outer Blue Rounded Square Container -->
  <rect x="1" y="1" width="22" height="22" rx="4.5" ry="4.5" fill="#0284C7"/>

  <!-- Inner White Rounded Square Boundary Frame -->
  <rect x="3" y="3" width="18" height="18" rx="3" ry="3" fill="none" stroke="#FFFFFF" stroke-width="1.0"/>

  <!-- White Subdivision Mesh Lines (Thin Stroke) -->
  <line x1="12.5" y1="7" x2="12.8" y2="3" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16.5" y1="9.5" x2="21" y2="6.6" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="15.5" x2="19.2" y2="19.2" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="9" y1="17.2" x2="4.8" y2="19.5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="7.2" y1="10" x2="3" y2="9.0" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Central White Pentagonal EA Zone -->
  <polygon points="12.5,7 16.5,9.5 16,15.5 9,17.2 7.2,10" fill="none" stroke="#FFFFFF" stroke-width="1.0" stroke-linejoin="round"/>

  <!-- Solid White House Symbol inside Central EA Zone -->
  <!-- Chimney -->
  <rect x="13.1" y="9.8" width="0.8" height="1.6" fill="#FFFFFF"/>
  <!-- Roof -->
  <path d="M 12 9.5 L 9.4 11.8 H 14.6 Z" fill="#FFFFFF"/>
  <!-- House Body -->
  <rect x="10.2" y="11.8" width="3.6" height="3.0" fill="#FFFFFF"/>
  <!-- Doorway Cutout -->
  <rect x="11.4" y="13.2" width="1.2" height="1.6" fill="#0284C7"/>
</svg>
